name: Apply Proteus Wrapper Patch

on:
  push:
    branches:
      - diagnostics/racemenu-proteus-sync
    paths:
      - .github/workflows/apply-proteus-wrapper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Proteus wrapper boundaries
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("ProteusCompat/Source/ProteusRecurringQuestScript.psc")
          text = path.read_text(encoding="utf-8-sig")

          def function_block(source, signature):
              start = source.index(signature)
              end = source.index("endFunction", start) + len("endFunction")
              return start, end, source[start:end]

          # New Character: the shared Proteus routine is the wrapper boundary for
          # both the normal menu path (option 0) and alternative death (option 1).
          start, end, block = function_block(text, "Function Proteus_NewCharacter(int option)")

          marker = "\tProteus_CheckActiveMods()\n"
          replacement = marker + "\tif gtsActive == true\n\t\tGTSPlugin.ProteusBeginNewCharacter(player)\n\tendIf\n"
          if "ProteusBeginNewCharacter" not in block:
              if marker not in block:
                  raise RuntimeError("New Character active-mod marker not found")
              block = block.replace(marker, replacement, 1)

          spawn_marker = "\t\tProteus_LoadCharacterSpawn(player, characterSavingName)\n"
          spawn_save = spawn_marker + "\t\tif gtsActive == true\n\t\t\tActor gtsOutgoingActor = Proteus_GetSpawnActor(characterSavingName)\n\t\t\tif gtsOutgoingActor != NONE\n\t\t\t\tGTSPlugin.ProteusProfileSave(player, gtsOutgoingActor)\n\t\t\tendIf\n\t\tendIf\n"
          if "Actor gtsOutgoingActor = Proteus_GetSpawnActor(characterSavingName)" not in block:
              if spawn_marker not in block:
                  raise RuntimeError("New Character option-0 spawn marker not found")
              block = block.replace(spawn_marker, spawn_save, 1)

          death_marker = "\t\tProteus_ResetSpawn(presetName, 0)\n"
          death_save = "\t\tif gtsActive == true\n\t\t\tActor gtsOutgoingDeathActor = Proteus_GetSpawnActor(presetName)\n\t\t\tif gtsOutgoingDeathActor != NONE\n\t\t\t\tGTSPlugin.ProteusProfileSave(player, gtsOutgoingDeathActor)\n\t\t\tendIf\n\t\tendIf\n" + death_marker
          if "Actor gtsOutgoingDeathActor = Proteus_GetSpawnActor(presetName)" not in block:
              if death_marker not in block:
                  raise RuntimeError("New Character option-1 reset marker not found")
              block = block.replace(death_marker, death_save, 1)

          block, n = re.subn(
              r"\n\t;GTS compatibility: a Proteus \"New Character\" must start with fresh GTS progression\..*?(?=\n\t;reset vampirism status)",
              "\n\n\t;GTS runtime reset is owned by the native wrapper transaction and occurs\n\t;only after the pending New Character RaceMenu closes.",
              block,
              count=1,
              flags=re.S,
          )
          if n != 1 and "GTSSkillLevelReset" in block:
              raise RuntimeError("Legacy pre-RaceMenu GTS reset block was not removed")

          block, n = re.subn(
              r"\n\t;GTS v4: second hard reset after RaceMenu / starting-location flow\..*?(?=\n\t;save new character into the Proteus system)",
              "\n\n\t;Native ProteusSync owns the clean GTS working copy; Proteus continues\n\t;with its normal character save below.",
              block,
              count=1,
              flags=re.S,
          )
          if n != 1 and ("GTSSkillLevelFinalReset" in block or "GTSFinalSpells" in block):
              raise RuntimeError("Legacy post-RaceMenu GTS reset block was not removed")

          text = text[:start] + block + text[end:]

          # Existing-character switching: Proteus has already resolved the stable
          # incoming NPC (`target`). Resolve/save the outgoing stable NPC before
          # Proteus mutates Player, then load canonical native JSON last so it wins
          # over legacy Proteus GTS fields if both exist.
          start, end, block = function_block(text, "Function Proteus_SwitchCharacter()")

          save_marker = "\t\t\tString playerName = player.GetActorBase().GetName()\n\t\t\tProteus_CharacterSave(player, playerName)"
          save_replacement = "\t\t\tString playerName = player.GetActorBase().GetName()\n\t\t\tif gtsActive == true\n\t\t\t\tActor gtsOutgoingActor = Proteus_GetSpawnActor(playerName)\n\t\t\t\tif gtsOutgoingActor != NONE\n\t\t\t\t\tGTSPlugin.ProteusProfileSave(player, gtsOutgoingActor)\n\t\t\t\tendIf\n\t\t\tendIf\n\t\t\tProteus_CharacterSave(player, playerName)"
          if "GTSPlugin.ProteusProfileSave(player, gtsOutgoingActor)" not in block:
              if save_marker not in block:
                  raise RuntimeError("Switch outgoing save marker not found")
              block = block.replace(save_marker, save_replacement, 1)

          load_marker = "\t\t\t\tDebug.Notification(\"Character switch complete.\")"
          load_replacement = "\t\t\t\tif gtsActive == true\n\t\t\t\t\t;Canonical GTS JSON is authoritative. If no native profile exists yet,\n\t\t\t\t\t;Load returns false and Proteus's legacy GTS fields remain as a migration fallback.\n\t\t\t\t\tGTSPlugin.ProteusProfileLoad(player, target)\n\t\t\t\tendIf\n" + load_marker
          if "GTSPlugin.ProteusProfileLoad(player, target)" not in block:
              if load_marker not in block:
                  raise RuntimeError("Switch completion marker not found")
              block = block.replace(load_marker, load_replacement, 1)

          text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8")

          # Assertions make this one-shot patch fail loudly rather than silently
          # producing a half-wrapped Proteus script after an upstream change.
          final = path.read_text(encoding="utf-8")
          required = [
              "GTSPlugin.ProteusBeginNewCharacter(player)",
              "GTSPlugin.ProteusProfileSave(player, gtsOutgoingActor)",
              "GTSPlugin.ProteusProfileSave(player, gtsOutgoingDeathActor)",
              "GTSPlugin.ProteusProfileLoad(player, target)",
          ]
          for needle in required:
              if needle not in final:
                  raise RuntimeError(f"Missing expected wrapper hook: {needle}")
          forbidden = ["GTSSkillLevelReset", "GTSSkillLevelFinalReset", "GTSFinalSpells"]
          for needle in forbidden:
              if needle in final:
                  raise RuntimeError(f"Legacy direct GTS reset survived: {needle}")

      - name: Commit patched Proteus source
        shell: bash
        run: |
          if git diff --quiet -- ProteusCompat/Source/ProteusRecurringQuestScript.psc; then
            echo "Proteus source already patched"
            exit 0
          fi
          git config user.name "GTS Proteus compatibility bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProteusCompat/Source/ProteusRecurringQuestScript.psc
          git commit -m "Wrap Proteus character transitions for GTS profiles"
          git push origin HEAD:diagnostics/racemenu-proteus-sync
