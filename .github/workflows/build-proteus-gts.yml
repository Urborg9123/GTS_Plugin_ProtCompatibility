name: Build Proteus GTS

on:
  workflow_dispatch:
  push:
    branches:
      - fix/npc-stolen-attribute-counters

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_INSTALLATION_ROOT: C:\vcpkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply NPC stolen attribute counter patch
        shell: pwsh
        run: |
          git apply patches/npc-stolen-attribute-counters.patch
          git diff --check
          git diff -- src/Utils/Actor/GTSUtils.cpp

      - name: Show build environment
        shell: pwsh
        run: |
          git --version
          cmake --version
          ninja --version
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      - name: Build GTS Plugin
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          call _CompileDLL.bat

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path "distribution\Package-Release")) {
            Write-Error "Build completed without distribution\Package-Release"
            exit 1
          }
          Get-ChildItem "distribution\Package-Release" -Recurse | Select-Object FullName, Length

      - name: Upload compiled GTS
        uses: actions/upload-artifact@v7
        with:
          name: GTS-Proteus-Compatibility
          path: distribution/Package-Release/
          if-no-files-found: error
