name: Build Proteus GTS PEX

on:
  workflow_dispatch:
  push:
    paths:
      - 'ProteusCompat/**'
      - '.github/workflows/build-proteus-pex.yml'
  pull_request:
    paths:
      - 'ProteusCompat/**'
      - '.github/workflows/build-proteus-pex.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout GTS compatibility repository
        uses: actions/checkout@v6
      - name: Build exact installed Proteus Player wrapper PEX
        shell: pwsh
        run: ./ProteusCompat/CI/build-exact-player.ps1
      - name: Upload Proteus GTS Papyrus artifact
        uses: actions/upload-artifact@v7
        with:
          name: Proteus-GTS-Exact-Player-Wrapper-Papyrus
          path: artifact/
          if-no-files-found: error
